# GitHub Secret Scanning Configuration for Red Mercury
# Narrowly scoped exclusions strictly for documented synthetic SAST/secret-scanner
# unit test fixtures and benchmark payloads, keeping full scanning active on
# backend/, frontend/, electron/, nginx/, scripts/, root configs, and all other tests/.
paths-ignore:
  - "tests/test_analyst.py"
  - "tests/test_api_reliability_and_resilience.py"
  - "tests/test_benchmark_framework.py"
  - "tests/test_ci_cd_release_gates.py"
  - "tests/test_ci_gate_regression.py"
  - "tests/test_difficult_security_scenarios.py"
  - "tests/test_evidence_management.py"
  - "tests/test_evidence_traceability.py"
  - "tests/test_github_integration.py"
  - "tests/test_integration.py"
  - "tests/test_performance_and_resource_limits.py"
  - "tests/test_phase4_core_pipeline_tenant_security.py"
  - "tests/test_production_readiness.py"
  - "tests/test_sandbox.py"
  - "tests/test_scanner_accuracy_benchmarks.py"
  - "tests/test_scanners.py"
  - "tests/test_security_assessment.py"
  - "tests/test_verification.py"
  - "benchmark/**"
  - "samples/**"
