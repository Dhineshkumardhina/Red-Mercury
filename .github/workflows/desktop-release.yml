name: "Red Mercury Desktop Release Installers"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Desktop installer target to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - win32-x64
          - darwin-x64
          - darwin-arm64
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: "Windows x64 NSIS Installer"
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'win32-x64'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: "Set up Node.js 22"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: "Install root and frontend dependencies"
        shell: pwsh
        run: |
          npm ci
          npm --prefix frontend ci
          python -m pip install --upgrade pip pillow

      - name: "Run Electron, frontend, and packaging verification checks"
        shell: pwsh
        run: |
          node --test electron/security.test.cjs
          npm --prefix frontend run lint
          npm --prefix frontend run test
          npm run build:desktop

      - name: "Generate desktop icons and stage Windows x64 runtime bundle"
        shell: pwsh
        run: |
          python scripts/generate_app_icon.py
          python scripts/prepare_desktop_bundle.py --target win32-x64

      - name: "Build Windows x64 NSIS Installer"
        shell: pwsh
        # Code signing placeholder: To sign release builds, configure repository secrets and uncomment:
        # env:
        #   CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        #   CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          .\node_modules\.bin\electron-builder.cmd --win nsis --x64

      - name: "Validate Windows package contents and checksums"
        shell: pwsh
        run: |
          $exe = Get-Item "dist-electron\RedMercury-Setup-x64.exe"
          if (-not $exe) { throw "Missing RedMercury-Setup-x64.exe" }
          $leakFiles = Get-ChildItem -Path "dist-electron\win-unpacked\resources" -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\.env' -or $_.Extension -in @('.db', '.sqlite', '.sqlite3') -or $_.FullName -match '\\(tests|__pycache__|\.pytest_cache)(\\|$)' }
          if ($leakFiles) {
            $leakFiles | Format-Table FullName
            throw "Unexpected dev/secret files found in packaged resources!"
          }
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash | Out-File "dist-electron\RedMercury-Setup-x64.exe.sha256"

      - name: "Generate Ed25519-Signed Update Manifest"
        shell: pwsh
        env:
          REDMERCURY_UPDATE_SIGNING_KEY: ${{ secrets.REDMERCURY_UPDATE_SIGNING_KEY }}
        run: |
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:REDMERCURY_UPDATE_SIGNING_KEY) {
            node scripts/generate_update_manifest.cjs `
              --version "$pkgVersion" `
              --url "https://github.com/Dhineshkumardhina/Red-Mercury/releases/download/v$pkgVersion/RedMercury-Setup-x64.exe" `
              --artifact "dist-electron\RedMercury-Setup-x64.exe" `
              --output "dist-electron\update-manifest-win32-x64.json" `
              --platform "win32" `
              --arch "x64" `
              --publisher "Xerova Digital Solutions"
            Copy-Item "dist-electron\update-manifest-win32-x64.json" -Destination "dist-electron\update-manifest.json" -Force
          } else {
            Write-Host "REDMERCURY_UPDATE_SIGNING_KEY secret not configured. Skipping manifest signature generation."
          }

      - name: "Upload Windows x64 installer artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redmercury-win32-x64
          path: |
            dist-electron/RedMercury-Setup-x64.exe
            dist-electron/RedMercury-Setup-x64.exe.sha256
            dist-electron/update-manifest*
          if-no-files-found: warn
          retention-days: 30

  build-macos-x64:
    name: "macOS Intel x64 DMG Installer"
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'darwin-x64'
    runs-on: macos-13
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: "Set up Node.js 22"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: "Install root and frontend dependencies"
        run: |
          npm ci
          npm --prefix frontend ci
          python3 -m pip install --upgrade pip pillow

      - name: "Run Electron, frontend, and packaging verification checks"
        run: |
          node --test electron/security.test.cjs
          npm --prefix frontend run lint
          npm --prefix frontend run test
          npm run build:desktop

      - name: "Generate desktop icons and stage macOS runtime bundle"
        run: |
          python3 scripts/generate_app_icon.py
          python3 scripts/prepare_desktop_bundle.py --target darwin-x64

      - name: "Build macOS DMG and ZIP"
        # Code signing placeholder: To sign and notarize macOS release builds, configure repository secrets and uncomment:
        # env:
        #   CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        #   CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        #   APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        #   APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        #   APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ./node_modules/.bin/electron-builder --mac dmg zip --x64

      - name: "Validate macOS bundle contents and checksums"
        run: |
          test -f "dist-electron/RedMercury-macOS-x64.dmg"
          APP_DIR=$(find dist-electron -maxdepth 3 -name "Red Mercury.app" | head -n 1)
          test -n "$APP_DIR"
          if find "$APP_DIR/Contents/Resources" \( -name ".env*" -o -name "*.db*" -o -name "__pycache__" -o -name "tests" \) | grep -q .; then
            echo "Unexpected dev/secret files found in macOS app bundle!"
            exit 1
          fi
          shasum -a 256 "dist-electron/RedMercury-macOS-x64.dmg" > "dist-electron/RedMercury-macOS-x64.dmg.sha256"

      - name: "Upload macOS installer artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redmercury-darwin-x64
          path: |
            dist-electron/RedMercury-macOS-x64.dmg
            dist-electron/RedMercury-macOS-x64.dmg.sha256
            dist-electron/RedMercury-macOS-x64.zip
          if-no-files-found: error
          retention-days: 30

  build-macos-arm64:
    name: "macOS Apple Silicon ARM64 DMG Installer"
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'darwin-arm64'
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: "Set up Node.js 22"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: "Install root and frontend dependencies"
        run: |
          npm ci
          npm --prefix frontend ci
          python3 -m pip install --upgrade pip pillow

      - name: "Run Electron, frontend, and packaging verification checks"
        run: |
          node --test electron/security.test.cjs
          npm --prefix frontend run lint
          npm --prefix frontend run test
          npm run build:desktop

      - name: "Generate desktop icons and stage macOS runtime bundle"
        run: |
          python3 scripts/generate_app_icon.py
          python3 scripts/prepare_desktop_bundle.py --target darwin-arm64

      - name: "Build macOS DMG and ZIP"
        # Code signing placeholder: To sign and notarize macOS release builds, configure repository secrets and uncomment:
        # env:
        #   CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        #   CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        #   APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        #   APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        #   APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ./node_modules/.bin/electron-builder --mac dmg zip --arm64

      - name: "Validate macOS bundle contents and checksums"
        run: |
          test -f "dist-electron/RedMercury-macOS-arm64.dmg"
          APP_DIR=$(find dist-electron -maxdepth 3 -name "Red Mercury.app" | head -n 1)
          test -n "$APP_DIR"
          if find "$APP_DIR/Contents/Resources" \( -name ".env*" -o -name "*.db*" -o -name "__pycache__" -o -name "tests" \) | grep -q .; then
            echo "Unexpected dev/secret files found in macOS app bundle!"
            exit 1
          fi
          shasum -a 256 "dist-electron/RedMercury-macOS-arm64.dmg" > "dist-electron/RedMercury-macOS-arm64.dmg.sha256"

      - name: "Upload macOS installer artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redmercury-darwin-arm64
          path: |
            dist-electron/RedMercury-macOS-arm64.dmg
            dist-electron/RedMercury-macOS-arm64.dmg.sha256
            dist-electron/RedMercury-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: "Publish GitHub Desktop Release"
    needs: [build-windows-x64, build-macos-x64, build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Dhineshkumardhina/Red-Mercury'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Download Windows build artifacts"
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: redmercury-win32-x64
          path: dist-release

      - name: "Download macOS Intel artifacts"
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: redmercury-darwin-x64
          path: dist-release

      - name: "Download macOS Apple Silicon artifacts"
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: redmercury-darwin-arm64
          path: dist-release

      - name: "List consolidated release files"
        run: |
          ls -la dist-release

      - name: "Publish GitHub Release with Signed Artifacts"
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
