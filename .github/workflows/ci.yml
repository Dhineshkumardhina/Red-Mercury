name: "Red Mercury CI - Test, Lint, Security Audit & Release Gate"

on:
  push:
    branches: [ "main", "staging", "fix/**" ]
  pull_request:
    branches: [ "main", "staging", "fix/**" ]
  workflow_dispatch:

# Strictly adhere to least-privilege permissions: read-only access to contents
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Testing, Migration Verification & Security Regressions
  # ============================================================================
  backend-tests:
    name: "Backend Tests & Migration Consistency"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_redmercury
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test_redmercury"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: "Set up Node.js 22"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: "Install Backend Dependencies & Scanners"
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: "Build Worker Sandbox Image for Live Container Isolation Tests"
        run: |
          docker build -f Dockerfile.worker -t redmercury-worker:latest .

      - name: "Build Frontend Container Image for Live Nginx Security Header Tests"
        run: |
          docker build -f Dockerfile.frontend -t redmercury-frontend:test .

      - name: "Verify Python Syntax and Compilation"
        run: |
          python -m compileall backend/app -q

      - name: "Verify Alembic Migration Linear Ordering"
        run: |
          python -m pytest tests/test_migration_consistency.py -v

      - name: "Run Backend Pytest Suite (Unit, Live Postgres 16, Live Redis 7, Docker Sandbox & E2E)"
        env:
          APP_ENV: "development"
          DATABASE_URL: "sqlite:///./test_redmercury.db"
          TEST_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/test_redmercury"
          TEST_REDIS_URL: "redis://127.0.0.1:6379/15"
          SECRET_KEY: "ci-testing-secret-key-at-least-32-chars-long"
          SANDBOX_ALLOW_HOST_FALLBACK: "true"
        run: |
          mkdir -p .redmercury_artifacts
          set -o pipefail
          python -m pytest tests/ -v --tb=short --durations=25 --timeout=120 --junitxml=.redmercury_artifacts/pytest-results.xml 2>&1 | tee .redmercury_artifacts/pytest-output.log

      - name: "Upload Backend Test Results Artifact"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-pytest-results
          path: .redmercury_artifacts/pytest-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: "Upload Backend Diagnostic Log Artifact"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-pytest-log
          path: .redmercury_artifacts/pytest-output.log
          if-no-files-found: warn
          retention-days: 14

  # ============================================================================
  # 2. Frontend Tests, TypeScript Type Checks & Production Build
  # ============================================================================
  frontend-build-and-test:
    name: "Frontend Tests, Lint & Production Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Set up Node.js 22"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: "Install Frontend Dependencies"
        working-directory: frontend
        run: npm ci

      - name: "Run TypeScript Type Checks & Linting"
        working-directory: frontend
        run: npm run lint

      - name: "Run Frontend Vitest Suite"
        working-directory: frontend
        run: npm test

      - name: "Run Electron Security Regression Suite"
        run: node --test electron/security.test.cjs

      - name: "Build Frontend Production Bundle"
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # 3. Supply Chain Security, Dependency Audits & Secret Scanning
  # ============================================================================
  security-audit-and-secret-scan:
    name: "Supply Chain Audit & Secret Scanning"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: "Checkout repository (full history for secret scanning)"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.11"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Python Audit Tools"
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: "Set up Node.js 22"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: "Download, Verify SHA-256 Checksum, and Install Gitleaks"
        run: |
          GITLEAKS_VERSION="8.18.2"
          GITLEAKS_SHA256="6298c9235dfc9278c14b28afd9b7fa4e6f4a289cb1974bd27949fc1e9122bdee"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm -f gitleaks.tar.gz
          gitleaks version

      - name: "Run Gitleaks Secret Detection"
        run: |
          gitleaks detect --verbose --redact

      - name: "Run Backend Dependency Vulnerability Audit"
        run: |
          # Note: CVE-2026-132276 affects wcmatch~=8.5.1 which is strictly upper-bounded (<9.0) by upstream semgrep;
          # Red Mercury does not invoke wcmatch.globmatch/fnmatch on user filenames.
          python -m pip_audit -r backend/requirements.txt --desc on --ignore-vuln CVE-2026-132276

      - name: "Run Frontend Dependency Vulnerability Audit"
        working-directory: frontend
        run: |
          npm audit --audit-level=high

      - name: "Run AST Security Linter (Bandit)"
        run: |
          bandit -r backend/app -ll -ii

  # ============================================================================
  # 4. Container Configuration & Dockerfile Validation
  # ============================================================================
  container-validation:
    name: "Container & Compose Configuration Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: "Validate API Dockerfile"
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: redmercury-api:test

      - name: "Validate Worker Dockerfile"
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          tags: redmercury-worker:test

      - name: "Validate Frontend Dockerfile"
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: redmercury-frontend:test

      - name: "Validate Production Docker Compose Configuration"
        env:
          POSTGRES_PASSWORD: "ci-testing-database-password-validation"
          SECRET_KEY: "ci-testing-secret-key-at-least-32-chars-long"
        run: |
          docker compose -f docker-compose.prod.yml config -q

  # ============================================================================
  # 5. Mandatory Release Gate
  # ============================================================================
  mandatory-release-gate:
    name: "Mandatory Production Release Gate"
    needs:
      - backend-tests
      - frontend-build-and-test
      - security-audit-and-secret-scan
      - container-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: "Confirm Gate Success"
        run: |
          echo "================================================================="
          echo "✅ REDMERCURY AI PRODUCTION RELEASE GATE: PASSED"
          echo "================================================================="
          echo "All required pre-merge and deployment conditions have been verified:"
          echo "  - Backend Unit, Resilience and E2E Tests: PASSED"
          echo "  - Frontend Vitest, TypeScript Lint and Build: PASSED"
          echo "  - Supply Chain Audits and Secret Detection: PASSED"
          echo "  - Multi-stage Docker Container Configurations: PASSED"
          echo "  - Alembic Migration Linear Chain: VERIFIED"
          echo "Release candidate is certified for production deployment."
